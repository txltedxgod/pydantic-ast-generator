[project]
name = "pydantic-ast-generator"
version = "1.0.0"
description = "AST-backed schema compiler emitting validated Pydantic v2 models from SQL DDL and JSON Schema"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.2.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
